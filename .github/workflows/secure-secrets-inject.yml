name: Secure Secrets Inject (Reusable)

# =============================================================================
# 複数リポジトリから呼び出せる再利用可能ワークフロー。
#
# パスワード・長期鍵ファイルを一切使わず、Workload Identity Federation で
# GCP に認証し、Secret Manager からアプリ固有のシークレットを取得して
# 後続ジョブに envs として渡す。
#
# 呼び出し側の使用例（yourwish/.github/workflows/build.yml）:
#
#   jobs:
#     secrets:
#       uses: zka32101/shared_core/.github/workflows/secure-secrets-inject.yml@main
#       with:
#         app_name: yourwish
#         gcp_project_id: yourwish-prod-123456
#         secret_keys: "revenuecat-api-key,admob-app-id,firebase-admin-key"
#       permissions:
#         id-token: write
#         contents: read
#
#     build:
#       needs: secrets
#       runs-on: ubuntu-latest
#       env:
#         REVENUECAT_API_KEY: ${{ needs.secrets.outputs.revenuecat_api_key }}
#       steps:
#         - run: flutter build apk --dart-define=REVENUECAT_API_KEY=$REVENUECAT_API_KEY
#
# 注意: outputs はログに残る可能性があるため、GitHub Actions の
#       `::add-mask::` を併用し、後続ジョブでは env 経由でのみ使用すること。
# =============================================================================

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
        description: "アプリ識別名（例: yourwish, goen）"
      gcp_project_id:
        required: true
        type: string
        description: "対象アプリの GCP プロジェクト ID"
      gcp_service_account:
        required: true
        type: string
        description: "terraform output service_account_email の値"
      gcp_wif_provider:
        required: true
        type: string
        description: "terraform output workload_identity_provider の値"
      secret_keys:
        required: true
        type: string
        description: "カンマ区切りのシークレットキー名（例: revenuecat-api-key,admob-app-id）"
    outputs:
      secrets_json:
        description: "取得したシークレットを {key: value} 形式でまとめた JSON（後続ジョブでマスク済み変数として展開すること）"
        value: ${{ jobs.fetch.outputs.secrets_json }}

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # WIF トークン発行に必須
      contents: read
    outputs:
      secrets_json: ${{ steps.collect.outputs.json }}
    steps:
      - name: Authenticate to GCP via Workload Identity Federation (no key file)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.gcp_wif_provider }}
          service_account: ${{ inputs.gcp_service_account }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Fetch secrets from Secret Manager
        id: collect
        run: |
          set -euo pipefail
          declare -A result
          IFS=',' read -ra KEYS <<< "${{ inputs.secret_keys }}"
          json="{"
          first=true
          for key in "${KEYS[@]}"; do
            secret_id="${{ inputs.app_name }}-${key}"
            value=$(gcloud secrets versions access latest \
              --secret="${secret_id}" \
              --project="${{ inputs.gcp_project_id }}")
            # ログに絶対出さない
            echo "::add-mask::${value}"
            if [ "$first" = true ]; then first=false; else json="${json},"; fi
            env_key=$(echo "$key" | tr '[:lower:]-' '[:upper:]_')
            json="${json}\"${env_key}\":\"${value}\""
          done
          json="${json}}"
          echo "json=${json}" >> "$GITHUB_OUTPUT"
