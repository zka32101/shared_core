name: Firestore Rules Test

# firestore.rules を変更した PR で、エミュレータ上のテストを実行する。
# ランキングのクライアント書き込み禁止・ミッション進捗の作成・他人のデータへのアクセス拒否などを検証。
on:
  pull_request:
    paths: ['firestore.rules', 'tests/firestore_rules/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/firestore_rules
    steps:
      - uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2 # v4.0.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
