name: Firestore Rules Test

# firestore.rules を変更した PR で、エミュレータ上のテストを実行する。
# ランキングのクライアント書き込み禁止・ミッション進捗の作成・他人のデータへのアクセス拒否などを検証。
on:
  pull_request:
    paths: ['firestore.rules', 'tests/firestore_rules/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/firestore_rules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
