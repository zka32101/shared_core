name: shared_core
description: "小学コレシリーズ共通パッケージ — models / providers / widgets / services / theme"
version: 0.1.1
publish_to: 'none'

environment:
  sdk: ^3.9.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.0
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.5.0
  firebase_remote_config: ^5.1.0
  cloud_functions: ^4.6.0
  uuid: ^4.0.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  fl_chart: ">=0.67.0 <0.71.0"
  flutter_local_notifications: ">=17.0.0 <19.0.0"
  timezone: ^0.9.0
  cross_promo_kit:
    git:
      url: https://github.com/zka32101/cross_promo_kit.git
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - lib/assets/badge_icons/
    - lib/assets/avatars/
    - lib/assets/ui_elements/
    - lib/assets/shop/
