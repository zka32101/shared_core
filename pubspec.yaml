name: shared_core
description: "小学コレシリーズ共通パッケージ — models / providers / widgets / services / theme"
version: 0.1.1
publish_to: 'none'

environment:
  sdk: ^3.9.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.3.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_remote_config: ^6.7.0
  firebase_messaging: ^16.7.0
  uuid: ^4.0.0
  google_fonts: ^9.0.0
  flutter_svg: ^2.0.10+1
  fl_chart: ^1.3.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  intl: ^0.20.3
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  cross_promo_kit:
    git:
      url: https://github.com/zka32101/cross_promo_kit.git
      ref: v0.3.0
  purchases_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
  analyzer: ^14.7.0
  json_serializable: ^6.7.0

flutter:
  assets:
    - lib/assets/badge_icons/
    - lib/assets/avatars/
    - lib/assets/ui_elements/
    - lib/assets/shop/
